version: 2
updates:
  - package-ecosystem: "pub"
    directory: /
    groups:
      pub:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 4
  - package-ecosystem: "github-actions"
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
  - package-ecosystem: "gitsubmodule"
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 4