name: Dart CI
on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "test_consume_**"
  pull_request:
    branches:
      - "**"
concurrency:
  group: opentelemetry-coverage-${{ github.ref }}-1
  cancel-in-progress: true
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test-dartv3_4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9
      - run: make init format analyze test
      - name: Package Artifacts
        run: ./package.sh

  test-dartvStable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: make init format analyze test
